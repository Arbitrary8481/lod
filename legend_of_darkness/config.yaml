name: Legend of Darkness
version: "0.2.0"
slug: legend_of_darkness
description: A multiplayer fantasy text adventure in the style of the classic BBS door games.
url: https://github.com/Arbitrary8481/lod
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:sword-cross
panel_title: Legend of Darkness
options:
  forest_turns: 20
  pvp_fights: 3
  grave_fights: 10
  bank_interest: 3
  days_per_day: 1
schema:
  forest_turns: int(5,100)
  pvp_fights: int(0,20)
  grave_fights: int(0,50)
  bank_interest: float(0,20)
  days_per_day: int(1,4)
