<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legend of Darkness</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ctext y=%2213%22 font-size=%2213%22%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="banner">
    <div class="logo">Legend <span>of</span> Darkness</div>
    <div id="title" class="place"></div>
  </header>
  <main class="layout">
    <nav id="nav" class="panel nav" aria-label="Actions"></nav>
    <section id="text" class="panel story" aria-live="polite"></section>
    <aside class="panel stats">
      <details id="stats-wrap" open>
        <summary>Character</summary>
        <div id="stats"></div>
      </details>
    </aside>
  </main>
  <footer class="foot">Press the highlighted letter to choose an action.</footer>

  <dialog id="prompt">
    <form method="dialog" id="prompt-form">
      <label id="prompt-label" for="prompt-input"></label>
      <input id="prompt-input" autocomplete="off" maxlength="200">
      <div class="prompt-buttons">
        <button value="cancel" type="button" id="prompt-cancel">Cancel</button>
        <button value="ok" type="submit">OK</button>
      </div>
    </form>
  </dialog>
  <script src="static/app.js"></script>
</body>
</html>
